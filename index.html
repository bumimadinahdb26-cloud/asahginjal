<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONIKA - Monitoring Kesehatan Akses Dialysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #f3f4f6;
            --bg-card: #ffffff;
            --accent-purple: #7c3aed;
            --accent-purple-dark: #5b21b6;
            --accent-teal: #14b8a6;
            --accent-teal-dark: #0d9488;
            --accent-cyan: #06b6d4;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-gold: rgba(124, 58, 237, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-dark);
        }
        .bg-pattern {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                        linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
            z-index: -2;
        }
        .main-container { max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

        /* HEADER */
        .panel-header {
            position: relative; border-radius: 20px; overflow: hidden; min-height: 320px;
            display: flex; flex-direction: column; justify-content: flex-end;
            border: 2px solid var(--border-gold); box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .header-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(0.9); }
        .header-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.85) 40%, transparent 100%); }
        .header-content { position: relative; z-index: 2; padding: 30px; }
        
        .header-top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .header-left-group { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

        /* Clock */
        .digital-clock { display: flex; align-items: center; gap: 12px; background: transparent; padding: 12px 20px; border-radius: 16px; border: 2px solid var(--accent-cyan); }
        .clock-display { font-family: 'Orbitron', monospace; font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan); }

        /* Login Button */
        .user-login-btn { display: flex; align-items: center; gap: 10px; background: rgba(124, 58, 237, 0.1); padding: 10px 18px; border-radius: 14px; border: 2px solid rgba(124, 58, 237, 0.3); cursor: pointer; transition: all 0.3s; }
        .user-login-btn:hover { border-color: var(--accent-purple); }
        .user-login-btn.logged-in { background: rgba(20, 184, 166, 0.1); border-color: rgba(20, 184, 166, 0.4); }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-purple), var(--accent-teal)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.85rem; display: none; }
        
        /* Buttons */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: all 0.3s; }
        .btn-teal { background: linear-gradient(135deg, var(--accent-teal), var(--accent-teal-dark)); color: white; box-shadow: 0 8px 30px rgba(20,184,166,0.3); }
        .discussion-link-btn { background: linear-gradient(135deg, var(--accent-teal), var(--accent-teal-dark)); color: white; padding: 14px 28px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; text-decoration: none; box-shadow: 0 8px 30px rgba(20,184,166,0.3); cursor: pointer; border: none; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: var(--bg-card); border: 2px solid var(--border-gold); padding: 30px; border-radius: 20px; width: 380px; max-width: 90vw; max-height: 85vh; overflow-y: auto; transform: scale(0.9); transition: transform 0.3s; position: relative; }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-close { position: absolute; top: 15px; right: 15px; width: 36px; height: 36px; border-radius: 50%; background: #f3f4f6; border: none; cursor: pointer; font-size: 18px; }
        .input-field { width: 100%; background: #f9fafb; border: 2px solid var(--border-subtle); padding: 14px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 16px; }

        /* Discussion Specifics */
        .discussion-modal { width: 95vw; max-width: 600px; height: 80vh; max-height: 700px; display: flex; flex-direction: column; }
        .comments-list { flex: 1; overflow-y: auto; margin-bottom: 16px; }
        .comment-item { background: #f9fafb; border: 1px solid var(--border-subtle); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .comment-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-purple), var(--accent-teal)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; }
        .comment-text { font-size: 0.9rem; line-height: 1.5; }
        .comment-input-area textarea { width: 100%; min-height: 80px; resize: vertical; background: #f9fafb; border: 2px solid var(--border-subtle); border-radius: 12px; padding: 12px; font-size: 0.9rem; font-family: inherit; }

        /* Panel Footer */
        .panel-footer { background: var(--bg-card); border-radius: 20px; border: 2px solid var(--border-subtle); padding: 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <!-- MODALS -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('loginModal')">&times;</button>
            <h2 style="text-align:center; margin-bottom:20px; font-family:'Bebas Neue'; font-size:1.8rem;">Login</h2>
            <p style="font-size:14px; color:var(--text-muted); text-align:center; margin-bottom:16px;">Masukkan nama untuk diskusi.</p>
            <input type="text" id="loginNameInput" class="input-field" placeholder="Nama Anda...">
            <button class="btn btn-teal" style="width:100%;" onclick="performLogin()">Masuk</button>
        </div>
    </div>

    <div class="modal-overlay" id="discussionModal">
        <div class="modal-box discussion-modal">
            <button class="modal-close" onclick="closeModal('discussionModal')">&times;</button>
            <h2 style="font-family:'Bebas Neue'; font-size:1.6rem; color:var(--accent-teal-dark);">Komentar & Diskusi</h2>
            <div style="margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border-subtle);">
                <span id="commentCount" style="background:var(--accent-teal); color:white; padding:4px 10px; border-radius:10px; font-size:0.8rem;">0</span>
            </div>
            <div class="comments-list" id="commentsList"></div>
            <div class="comment-input-area" id="commentInputArea"></div>
        </div>
    </div>

    <div class="modal-overlay" id="loadingModal">
        <div class="modal-box" style="padding:20px; text-align:center;">
            <div class="spinner" style="margin:20px auto; border: 3px solid #f3f3f3; border-top: 3px solid var(--accent-teal); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;"></div>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
            <p style="color:var(--text-muted);">Menyimpan...</p>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <div class="panel-header">
            <div class="header-bg" style="background-image: url('banner-saya.png');"></div>
            <div class="header-overlay"></div>
            <div class="header-content">
                <div class="header-top-row">
                    <div class="header-left-group">
                        <div class="digital-clock">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            <div class="clock-display" id="clockTime">--:--:--</div>
                        </div>
                        
                        <!-- Tombol Login/Nama User -->
                        <div class="user-login-btn" id="userLoginBtn" onclick="handleUserButtonClick()">
                            <div class="user-avatar" id="userAvatar"></div>
                            <span id="userBtnText">Login / Masuk</span>
                        </div>
                    </div>
                    <button class="btn" style="background:transparent; border:2px solid var(--accent-purple); color:var(--accent-purple-dark);" onclick="alert('Panduan')">Panduan</button>
                </div>
                
                <h1 style="font-family:'Bebas Neue'; font-size:4rem; line-height:1; background:linear-gradient(135deg, var(--accent-purple-dark), #991b1b); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">MONIKA</h1>
                <p style="color:var(--accent-purple-dark); font-weight:600; margin-bottom:20px;">Monitoring Kesehatan Akses Dialysis</p>
                
                <!-- Tombol Diskusi -->
                <button class="discussion-link-btn" onclick="openDiscussion()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Komentar dan Diskusi
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="panel-footer">
            <div style="display:flex; align-items:center; gap:15px;">
                <div style="width:50px; height:50px; border-radius:12px; background:linear-gradient(145deg, #f5f3ff, #ede9fe); display:flex; align-items:center; justify-content:center;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </div>
                <div>
                    <h3 style="font-family:'Bebas Neue'; font-size:1.5rem;">INFO APLIKASI</h3>
                    <p style="font-size:0.8rem; color:var(--text-muted);">MONIKA - Monitoring Kesehatan Akses Dialysis</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ================= KONFIGURASI PENTING =================
    // GANTI URL INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA
    const API_URL = 'https://script.google.com/macros/s/AKfycbwkklSohZuevQaERjnA-xQkdYmbRF1zg3Q_kE-XcjkThRyIzrexd3WFgQzried3TR6R/exec'; 
    // =======================================================

    let currentUser = null;

    // --- INIT ---
    window.onload = function() {
        updateClock();
        setInterval(updateClock, 1000);
        loadUser();
    };

    // --- CLOCK ---
    function updateClock() {
        const now = new Date();
        document.getElementById('clockTime').textContent = now.toLocaleTimeString('id-ID');
    }

    // --- AUTH ---
    function loadUser() {
        const u = localStorage.getItem('monika_user');
        if(u) {
            currentUser = JSON.parse(u);
            updateUserUI();
        }
    }
    
    function handleUserButtonClick() {
        if(currentUser) {
            if(confirm(`Logout sebagai ${currentUser.name}?`)) logout();
        } else {
            openModal('loginModal');
        }
    }

    function performLogin() {
        const name = document.getElementById('loginNameInput').value.trim();
        if(!name) return alert('Nama kosong!');
        currentUser = { name: name };
        localStorage.setItem('monika_user', JSON.stringify(currentUser));
        updateUserUI();
        closeModal('loginModal');
        if(document.getElementById('discussionModal').classList.contains('active')) renderDiscussion();
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('monika_user');
        updateUserUI();
        if(document.getElementById('discussionModal').classList.contains('active')) renderDiscussion();
    }

    function updateUserUI() {
        const btn = document.getElementById('userLoginBtn');
        const txt = document.getElementById('userBtnText');
        const av = document.getElementById('userAvatar');
        if(currentUser) {
            btn.classList.add('logged-in');
            txt.textContent = currentUser.name;
            av.style.display = 'flex';
            av.textContent = currentUser.name.charAt(0).toUpperCase();
        } else {
            btn.classList.remove('logged-in');
            txt.textContent = 'Login / Masuk';
            av.style.display = 'none';
        }
    }

    // --- DISCUSSION ---
    function openDiscussion() {
        openModal('discussionModal');
        renderDiscussion();
    }

    async function renderDiscussion() {
        const list = document.getElementById('commentsList');
        const inputArea = document.getElementById('commentInputArea');
        
        list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Memuat komentar...</div>';

        // Fetch comments from API
        try {
            const res = await fetch(`${API_URL}?action=getComments`);
            const data = await res.json();
            const comments = data.comments || [];
            
            document.getElementById('commentCount').textContent = comments.length;

            if(comments.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Belum ada komentar.<br>Jadilah yang pertama!</div>';
            } else {
                list.innerHTML = comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-header">
                            <div class="comment-avatar">${c.author.charAt(0)}</div>
                            <div style="font-weight:600; font-size:0.9rem;">${escapeHtml(c.author)}</div>
                            <div style="font-size:0.7rem; color:var(--text-muted); margin-left:auto;">${formatTime(c.timestamp)}</div>
                        </div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                    </div>
                `).join('');
            }
        } catch (e) {
            list.innerHTML = '<div style="text-align:center; padding:20px; color:red;">Gagal memuat data. Pastikan API_URL sudah benar.</div>';
        }

        // Render Input
        if(currentUser) {
            inputArea.innerHTML = `
                <textarea id="newComment" placeholder="Tulis komentar..."></textarea>
                <button class="btn btn-teal" style="margin-top:10px; padding:10px 20px;" onclick="postComment()">Kirim</button>
            `;
        } else {
            inputArea.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Anda harus <a href="#" onclick="closeModal('discussionModal'); openModal('loginModal'); return false;" style="color:var(--accent-purple); font-weight:700;">login</a> untuk berkomentar.</div>`;
        }
    }

    async function postComment() {
        const text = document.getElementById('newComment').value.trim();
        if(!text) return alert("Komentar kosong!");
        
        openModal('loadingModal');
        
        try {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors', // Google Script membutuhkan no-cors
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    action: 'addComment',
                    author: currentUser.name,
                    text: text
                })
            });
            
            // Karena no-cors, kita tidak bisa baca response, kita asumsikan sukses
            closeModal('loadingModal');
            document.getElementById('newComment').value = '';
            
            // Tambahkan manual ke UI agar terlihat instan
            // Atau render ulang dari server (tapi butuh waktu beberapa detik)
            alert("Komentar terkirim!");
            renderDiscussion(); // Refresh dari server
            
        } catch(e) {
            closeModal('loadingModal');
            alert("Gagal mengirim komentar.");
        }
    }

    // --- HELPER ---
    function escapeHtml(text) {
        if (!text) return text;
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatTime(isoString) {
        const date = new Date(isoString);
        return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // Close modal on overlay click
    document.querySelectorAll('.modal-overlay').forEach(o => {
        o.addEventListener('click', function(e) { if(e.target === this) closeModal(this.id); });
    });

    </script>
</body>
</html>
